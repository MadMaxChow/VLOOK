<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
html, body {
    margin: 0;
    padding: 0;
}

body {
    height: 300vh;
}

/* 红：bottom: 0 */
.red {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 10px;
    background: red;
    z-index: 100;
}

/* 蓝：safe area */
.blue {
    position: fixed;
    left: 0;
    right: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    height: 10px;
    background: blue;
    z-index: 101;
}

/* 黄：故意放在 bottom: 50px */
.yellow {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 50px;
    height: 10px;
    background: yellow;
    z-index: 102;
}

/* 绿色：故意放在 bottom: 100px */
.green {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 100px;
    height: 10px;
    background: lime;
    z-index: 103;
}

.label {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;

    padding: 10px;

    background: black;
    color: white;

    font: 14px monospace;
}
</style>
</head>

<body>

<div class="label">
    RED = bottom:0<br>
    BLUE = safe-area<br>
    YELLOW = bottom:50px<br>
    GREEN = bottom:100px
</div>

<div class="red"></div>
<div class="blue"></div>
<div class="yellow"></div>
<div class="green"></div>

</body>
</html>
